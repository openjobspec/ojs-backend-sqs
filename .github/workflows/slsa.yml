name: SLSA Provenance

on:
  workflow_call:
    inputs:
      base64-subjects:
        description: Base64-encoded sha256sum output for the release-published artifacts
        required: true
        type: string

permissions: read-all

jobs:
  provenance:
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # documented exception: exact SLSA tag; sole mutable ref
    with:
      base64-subjects: "${{ inputs.base64-subjects }}"
      upload-assets: true
