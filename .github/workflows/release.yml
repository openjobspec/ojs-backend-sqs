name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Verify release tag
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests without AWS services (service-backed tests may skip)
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "dist/ojs-server_${VERSION}_linux_amd64" ./cmd/ojs-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "dist/ojs-server_${VERSION}_darwin_arm64" ./cmd/ojs-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "dist/ojs-server_${VERSION}_windows_amd64.exe" ./cmd/ojs-server

      - name: Generate checksums and provenance subjects
        id: hash
        run: |
          cd dist
          sha256sum ojs-server_* > checksums.txt
          echo "hashes=$(sha256sum ojs-server_* checksums.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          generate_release_notes: true
          files: |
            dist/ojs-server_*
            dist/checksums.txt

  provenance:
    needs: binaries
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: ./.github/workflows/slsa.yml
    with:
      base64-subjects: ${{ needs.binaries.outputs.hashes }}

  container:
    runs-on: ubuntu-latest
    needs: [binaries, provenance]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ needs.binaries.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
