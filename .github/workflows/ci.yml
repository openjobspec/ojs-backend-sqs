name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
  FOUNDATION_COMMON_SHA: "1c14ab26ffa9923825d8ccecc99c72f07c66c9a7"
  FOUNDATION_PROTO_SHA: "966a023140e51f20a98277485a553b8e80c2e6f0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sqs,dynamodb
          DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: 1
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 5
    env:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      OJS_LOCALSTACK_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: ojs-jobs-test
      SQS_QUEUE_PREFIX: ojs-test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=40
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold of ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - run: go build -o bin/ojs-server ./cmd/ojs-server

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - name: Run govulncheck
        run: |
          env GOFLAGS= GOTOOLCHAIN=go1.26.6 go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOTOOLCHAIN=go1.26.6 govulncheck ./...
